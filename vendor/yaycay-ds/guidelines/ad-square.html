<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; display: grid; place-items: center; background: var(--cream-200); padding: 18px; }
  .ad { width: 500px; height: 500px; position: relative; overflow: hidden; background: var(--grad-scene); border: 4px solid var(--royal-600); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); }
  .cloud { position: absolute; background: var(--cream-50); border-radius: 999px; opacity: .9; }
  .logo { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 128px; filter: drop-shadow(0 4px 8px rgba(4,34,63,.3)); }
  .headline { position: absolute; top: 150px; left: 0; right: 0; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 62px; line-height: .98; color: var(--cream-50); -webkit-text-stroke: 6px var(--royal-600); paint-order: stroke fill; text-shadow: 1px 1px 0 var(--royal-700),2px 2px 0 var(--royal-700),3px 3px 0 var(--royal-700),4px 4px 0 var(--royal-700),5px 7px 10px rgba(4,34,63,.4); }
  .sub { position: absolute; top: 312px; left: 0; right: 0; text-align: center; color: var(--royal-800); font-weight: 800; font-size: 19px; text-shadow: 0 1px 3px rgba(255,255,255,.4); }
  .cta { position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%); background: var(--sun-400); color: var(--royal-800); font-family: var(--font-display); font-weight: 600; font-size: 21px; padding: 14px 34px; border: 3px solid var(--sun-600); border-radius: var(--radius-pill); box-shadow: 0 6px 0 var(--sun-600), var(--gloss-top); white-space: nowrap; }
  .sun { position: absolute; width: 120px; height: 120px; bottom: -50px; left: 50%; transform: translateX(-50%); background: radial-gradient(circle,#fff3c4 0%,#ffd778 60%,transparent 72%); border-radius: 999px; }
</style>
</head>
<body>
  <div class="ad">
    <div class="cloud" style="width:120px;height:34px;top:96px;left:40px;box-shadow:46px -12px 0 -5px var(--cream-50)"></div>
    <div class="cloud" style="width:84px;height:26px;top:120px;right:50px;opacity:.8"></div>
    <div class="sun"></div>
    <img class="logo" src="../assets/brand/yaycay-logo-transparent.png" alt="Yaycay" />
    <div class="headline">Plan the trip.<br />Keep the yay.</div>
    <div class="sub">Family holidays, planned together.</div>
    <div class="cta">Start planning free →</div>
  </div>
</body>
</html>
