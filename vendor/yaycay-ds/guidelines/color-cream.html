<!-- @dsCard group="Colors" viewport="700x150" name="Cream & warm neutrals" subtitle="Paper surfaces & cream-tinted greys." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--cream-100); font-family: var(--font-body); }
  .ramp { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-md); }
  .sw { flex: 1; height: 104px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; }
  .sw b { font-family: var(--font-display); font-weight: 600; font-size: 13px; }
  .sw span { font-size: 11px; font-weight: 700; opacity: .85; letter-spacing: .02em; }
  .dark { color: #fff; } .light { color: var(--royal-800); }
  .core { outline: 3px solid var(--royal-700); outline-offset: -3px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw light" style="background:var(--cream-50)"><b>cream 50</b><span>#FEFCF6</span></div>
    <div class="sw light core" style="background:var(--cream-100)"><b>100 ·page</b><span>#FBF7EC</span></div>
    <div class="sw light" style="background:var(--cream-300)"><b>cream 300</b><span>#EBE2C9</span></div>
    <div class="sw light" style="background:var(--sand-200)"><b>sand 200</b><span>#E3DDD0</span></div>
    <div class="sw dark" style="background:var(--sand-400)"><b>sand 400</b><span>#9A9384</span></div>
    <div class="sw dark" style="background:var(--sand-600)"><b>sand 600</b><span>#4A463D</span></div>
    <div class="sw dark" style="background:var(--ink)"><b>ink</b><span>#1C2733</span></div>
  </div>
</body>
</html>
