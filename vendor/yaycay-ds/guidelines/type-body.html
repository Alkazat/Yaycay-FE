<!-- @dsCard group="Type" viewport="700x250" name="Nunito — body" subtitle="Rounded, friendly UI & body face. 400 / 700 / 800." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--cream-100); font-family: var(--font-body); color: var(--ink); }
  p { font-size: 16px; line-height: 1.5; max-width: 560px; margin: 0 0 12px; }
  .alpha { font-size: 22px; font-weight: 800; color: var(--royal-600); margin-bottom: 10px; }
  .weights { display: flex; gap: 20px; align-items: baseline; }
  .weights span { font-size: 18px; }
  .meta { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-top: 10px; }
</style>
</head>
<body>
  <div class="alpha">AaBbCc 0123456789 — the quick brown fox</div>
  <p>Plan the trip, split the to-do list, and count down the sleeps together. Yaycay keeps the
     admin tidy so your family can get to the fun part — making memories.</p>
  <div class="weights">
    <span style="font-weight:400">Regular 400</span>
    <span style="font-weight:600">Semibold 600</span>
    <span style="font-weight:700">Bold 700</span>
    <span style="font-weight:800">Black 800</span>
    <span style="font-weight:400;font-style:italic">Italic</span>
  </div>
  <div class="meta">var(--font-body) · "Nunito"</div>
</body>
</html>
