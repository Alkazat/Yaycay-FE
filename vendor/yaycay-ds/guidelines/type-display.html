<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--cream-100); font-family: var(--font-display); color: var(--royal-800); }
  .big { font-size: 76px; font-weight: 600; line-height: .95; letter-spacing: -.01em; }
  .alpha { font-size: 26px; font-weight: 500; color: var(--royal-500); margin-top: 6px; }
  .weights { display: flex; gap: 22px; margin-top: 14px; align-items: baseline; }
  .weights span { font-size: 30px; }
  .meta { font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>
  <div class="big">Make memories</div>
  <div class="alpha">AaBbCcGgRrSsYy · 1234567890 · &amp; ! ?</div>
  <div class="weights">
    <span style="font-weight:400">Light 400</span>
    <span style="font-weight:500">Medium 500</span>
    <span style="font-weight:600">Semibold 600</span>
  </div>
  <div class="meta">var(--font-display) · "Fredoka"</div>
</body>
</html>
