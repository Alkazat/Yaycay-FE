<!-- @dsCard group="Brand" viewport="700x170" name="Signature gradients" subtitle="Sky, sunset, aqua, paper & the hero scene." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 22px; background: var(--cream-100); font-family: var(--font-body); }
  .row { display: flex; gap: 14px; }
  .item { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .g { height: 92px; border-radius: var(--radius-lg); border: 2.5px solid var(--royal-500); box-shadow: var(--shadow-sm); }
  .item b { font-family: var(--font-display); font-size: 12px; color: var(--royal-700); font-weight: 600; }
  .item span { font-size: 10px; font-weight: 700; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="g" style="background:var(--grad-sky)"></div><b>sky</b><span>--grad-sky</span></div>
    <div class="item"><div class="g" style="background:var(--grad-sunset)"></div><b>sunset</b><span>--grad-sunset</span></div>
    <div class="item"><div class="g" style="background:var(--grad-aqua)"></div><b>aqua</b><span>--grad-aqua</span></div>
    <div class="item"><div class="g" style="background:var(--grad-scene)"></div><b>scene</b><span>--grad-scene</span></div>
    <div class="item"><div class="g" style="background:var(--grad-paper)"></div><b>paper</b><span>--grad-paper</span></div>
  </div>
</body>
</html>
