<!-- @dsCard group="Brand" viewport="700x220" name="Logo on backgrounds" subtitle="Use the transparent lockup on cream, sky & sunset." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--cream-100); display: flex; gap: 14px; }
  .panel { flex: 1; height: 184px; border-radius: var(--radius-xl); display: grid; place-items: center; box-shadow: var(--shadow-md); overflow: hidden; }
  img { width: 76%; filter: drop-shadow(0 6px 12px rgba(4,34,63,.28)); }
  .sky { background: var(--grad-sky); }
  .sun { background: var(--grad-sunset); }
  .cream { background: var(--cream-100); border: 2.5px solid var(--sand-200); }
</style>
</head>
<body>
  <div class="panel cream"><img src="../assets/brand/yaycay-logo-transparent.png" alt="Yaycay on cream" /></div>
  <div class="panel sky"><img src="../assets/brand/yaycay-logo-transparent.png" alt="Yaycay on sky" /></div>
  <div class="panel sun"><img src="../assets/brand/yaycay-logo-transparent.png" alt="Yaycay on sunset" /></div>
</body>
</html>
