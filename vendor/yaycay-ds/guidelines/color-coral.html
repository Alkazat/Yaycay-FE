<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; background: var(--cream-100); font-family: var(--font-body); }
  .ramp { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-md); }
  .sw { flex: 1; height: 104px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; }
  .sw b { font-family: var(--font-display); font-weight: 600; font-size: 13px; }
  .sw span { font-size: 11px; font-weight: 700; opacity: .85; letter-spacing: .02em; }
  .dark { color: #fff; } .light { color: var(--royal-800); }
  .core { outline: 3px solid var(--royal-700); outline-offset: -3px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw light" style="background:var(--coral-300)"><b>300</b><span>#FF9B7A</span></div>
    <div class="sw light core" style="background:var(--coral-400)"><b>400 ·core</b><span>#FF6F4D</span></div>
    <div class="sw dark" style="background:var(--coral-500)"><b>500</b><span>#ED5435</span></div>
    <div class="sw dark" style="background:var(--coral-600)"><b>600</b><span>#CC3F24</span></div>
  </div>
</body>
</html>
