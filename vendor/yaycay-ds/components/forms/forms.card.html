<!-- @dsCard group="Components" viewport="700x340" name="Form controls" subtitle="Input, Select, Checkbox, Radio & Switch." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--cream-100); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; align-items: start; max-width: 640px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, Select, Checkbox, Switch } = window.YaycayDesignSystem_f48296;
    const Pin = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>);

    function Demo() {
      const [on, setOn] = React.useState(true);
      const [pace, setPace] = React.useState("relaxed");
      return (
        <div className="grid">
          <div className="col">
            <Input label="Trip name" placeholder="Summer in Sicily" icon={<Pin/>} hint="You can rename this later" />
            <Input label="Budget" defaultValue="£200" error="Pop in a number to continue" />
            <Select label="Travellers" placeholder="Choose…" options={["Just us two","Family of 4","Big group"]} defaultValue="Family of 4" />
          </div>
          <div className="col">
            <Checkbox label="Add the kids' packing list" defaultChecked />
            <Checkbox label="Book travel insurance" />
            <Checkbox radio name="pace" label="Relaxed" checked={pace==='relaxed'} onChange={()=>setPace('relaxed')} />
            <Checkbox radio name="pace" label="Action-packed" checked={pace==='action'} onChange={()=>setPace('action')} />
            <Switch label="Daily countdown email" checked={on} onChange={()=>setOn(!on)} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>
